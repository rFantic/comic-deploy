apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: comic-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
        - name: backend
          image: docker.io/library/docker-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: comic-secrets
                  key: DATABASE_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: comic-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: comic-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: comic-secrets
                  key: DB_NAME
            - name: REDIS_URL
              value: "redis://redis.comic-prod.svc.cluster.local:6379/0"
            - name: MINIO_ENDPOINT
              value: "minio.comic-prod.svc.cluster.local:9000"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: comic-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: comic-secrets
                  key: MINIO_SECRET_KEY
            - name: MINIO_SECURE
              value: "false"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: comic-secrets
                  key: SECRET_KEY
            - name: DEBUG
              value: "false"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://comic.apl.io.vn,https://comic-api.apl.io.vn"
            - name: PROJECTS_DIR
              value: "/data/projects"
            - name: FIREFOX_COOKIE_PATH
              value: "/root/.mozilla/firefox/676nh1ee.near/cookies.sqlite"
          volumeMounts:
            - name: projects-data
              mountPath: /data/projects
            - name: firefox-profile
              mountPath: /root/.mozilla/firefox/676nh1ee.near
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: projects-data
          persistentVolumeClaim:
            claimName: backend-projects
        - name: firefox-profile
          hostPath:
            path: /host-firefox-profile
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: comic-prod
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-projects
  namespace: comic-prod
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
