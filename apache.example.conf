# Example Apache configuration for comic.rfantic.de
# Place this in /etc/apache2/sites-available/comic.rfantic.de.conf
# Enable the site: sudo a2ensite comic.rfantic.de.conf
# Reload Apache: sudo systemctl reload apache2

<VirtualHost *:80>
    ServerName comic.rfantic.de
    Redirect permanent / https://comic.rfantic.de/
</VirtualHost>

<VirtualHost *:443>
    ServerName comic.rfantic.de

    # SSL configuration (adjust paths to your certificates)
    SSLEngine on
    SSLCertificateFile /path/to/your/certificate.crt
    SSLCertificateKeyFile /path/to/your/private.key

    # Increase body size limit for large image uploads
    LimitRequestBody 52428800

    # IMPORTANT: Forward all API requests to Node.js server
    ProxyPreserveHost On
    ProxyRequests Off
    
    # Forward /api/* to Node.js server
    ProxyPass /api/ http://localhost:3000/api/
    ProxyPassReverse /api/ http://localhost:3000/api/
    
    # WebSocket support (if needed)
    RewriteEngine on
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/(.*)$ ws://localhost:3000/api/$1 [P,L]

    # Serve static files
    DocumentRoot /path/to/comic-generator/dist
    
    <Directory /path/to/comic-generator/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # SPA fallback - serve index.html for all routes
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    # Cache static assets
    <LocationMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </LocationMatch>

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>
